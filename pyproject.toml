[project]
name = "faraz-honar"
version = "0.1.0"
description = "Multi-platform product price updater (Google Sheet source, DigiKala first) controlled via Telegram."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "gspread>=6.0",
    "google-auth>=2.28",
    "python-telegram-bot>=21.0",
    "APScheduler>=3.10",
    "PyYAML>=6.0",
    "jdatetime>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faraz_honar = ["state/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
